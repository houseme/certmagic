name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Keep this group distinct from the CI and Audit workflow groups.
concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match tag to Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG version=$VER"
          test "$TAG" = "$VER"
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"

  ci:
    name: Release CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  audit:
    name: Release audit
    needs: validate
    uses: ./.github/workflows/audit.yml

  publish:
    name: Publish to crates.io
    needs: [ validate, ci, audit ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Create the crates-io-publish environment in repo Settings with
    # tag/branch restrictions.
    environment: crates-io-publish
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: false
      - name: Verify package builds
        run: cargo package --locked
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Configure CARGO_REGISTRY_TOKEN in the crates-io environment." >&2
            exit 1
          fi
          cargo publish --locked --registry crates-io  
